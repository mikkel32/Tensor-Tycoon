name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: Build & balance checks (macOS 26)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Saves from shipped versions still load and play
        run: for f in Tests/Fixtures/*.json; do .build/release/TensorTycoon --check-save "$f"; done
      - name: Calendar check (integer calendar matches Foundation's)
        run: .build/release/TensorTycoon --calendar-check
      - name: Scenario playthroughs (countries, frontier run, classified research, chips, empire)
        run: .build/release/TensorTycoon --scenarios all
      - name: Determinism check (same seed, same game — in one process and across launches)
        run: |
          .build/release/TensorTycoon --determinism
          .build/release/TensorTycoon --playtest 2022 1 2 > /tmp/pt-a.txt
          .build/release/TensorTycoon --playtest 2022 1 2 > /tmp/pt-b.txt
          diff /tmp/pt-a.txt /tmp/pt-b.txt && echo "OK: two launches, identical playtests"
      - name: Research check (signatures, director, breakthroughs, xenoscience)
        run: .build/release/TensorTycoon --research 2017
      - name: Industry check (rival finances, rounds, IPOs, corrections, stakes)
        run: .build/release/TensorTycoon --industry 2017 | tail -40
      - name: Rival Watch check (rival runs, rumour mill, forecasts, code reds)
        run: .build/release/TensorTycoon --watch 2026 | grep -v "^    [A-Z]"
      - name: Experience check (delegates, alerts, inbox, monthly briefings, Chief of Staff fixes)
        run: .build/release/TensorTycoon --experience 2024
      - name: Scale check (100 GW campuses, 500K-GPU runs with ops agents, agent intelligence)
        run: .build/release/TensorTycoon --scale
      - name: Ventures check (swarms, alien tech, chip sales, money)
        run: .build/release/TensorTycoon --ventures 2026
      - name: Strategy check (traits, board, acquisitions, security, policy)
        run: .build/release/TensorTycoon --strategy 2022
      - name: Balance playthrough
        run: .build/release/TensorTycoon --simulate 2022 | tail -60
